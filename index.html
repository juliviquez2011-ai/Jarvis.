<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. OS - Groq Neural Core</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body, html { width: 100%; height: 100%; background-color: #020813; color: var(--theme-color, #00f0ff); overflow: hidden; transition: background 0.5s ease; }

        :root {
            --theme-color: #00f0ff;
            --theme-glow: rgba(0, 240, 255, 0.6);
            --theme-bg: rgba(2, 8, 19, 0.95);
        }

        #hud-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            pointer-events: none;
        }

        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .interactive {
            pointer-events: auto;
            z-index: 10;
        }

        #api-config-panel {
            position: absolute;
            top: 20px;
            left: 30px;
            background: var(--theme-bg);
            border: 1px solid var(--theme-glow);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            backdrop-filter: blur(5px);
            z-index: 100;
        }
        .api-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #api-config-panel input {
            background: #000;
            border: 1px solid var(--theme-color);
            color: #00ff66;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            width: 170px;
            outline: none;
        }

        #settings-toggle-btn {
            position: absolute;
            bottom: 25px;
            right: 25px;
            z-index: 10000;
        }

        #settings-modal {
            position: absolute;
            bottom: 80px;
            right: 25px;
            width: 320px;
            background: var(--theme-bg);
            border: 1px solid var(--theme-color);
            border-radius: 12px;
            padding: 15px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 25px var(--theme-glow);
            z-index: 20000;
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        #settings-modal h3 {
            font-size: 13px;
            border-bottom: 1px solid var(--theme-glow);
            padding-bottom: 5px;
            letter-spacing: 1px;
            color: var(--theme-color);
        }
        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 11px;
        }
        .setting-group label {
            color: var(--theme-color);
        }
        .setting-group select, .setting-group input {
            background: #000;
            border: 1px solid var(--theme-color);
            color: #00ff66;
            padding: 5px;
            border-radius: 4px;
            font-size: 11px;
            outline: none;
        }

        #top-right-slot {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 340px;
            height: 260px;
            border: 2px dashed var(--theme-glow);
            background: var(--theme-bg);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            backdrop-filter: blur(10px);
        }
        #viewer-3d {
            width: 100%;
            height: 140px;
            background: #000;
            border-radius: 6px;
            position: relative;
        }
        #cad-code-display {
            width: 100%;
            height: 75px;
            background: rgba(0, 10, 25, 0.9);
            border: 1px solid var(--theme-glow);
            border-radius: 4px;
            margin-top: 6px;
            padding: 5px;
            font-size: 10px;
            color: #00ff66;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .slot-title {
            font-size: 11px;
            margin-bottom: 4px;
            letter-spacing: 1px;
            color: var(--theme-color);
        }

        /* Widget de Clima y Telemetría Superior sobre el núcleo */
        #top-telemetry-widget {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--theme-bg);
            border: 1px solid var(--theme-glow);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 12px;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px var(--theme-glow);
            z-index: 50;
            pointer-events: auto;
            color: var(--theme-color);
        }

        #jarvis-chat {
            position: absolute;
            top: 185px;
            left: 30px;
            width: 400px;
            max-height: 40vh;
            overflow-y: auto;
            background: rgba(2, 8, 19, 0.85);
            border-left: 3px solid var(--theme-color);
            padding: 15px;
            font-size: 13px;
            border-radius: 0 8px 8px 0;
            backdrop-filter: blur(5px);
        }
        .msg { margin-bottom: 12px; line-height: 1.4; }
        .msg.jarvis { color: var(--theme-color); }
        .msg.user { color: #ffffff; text-align: right; }
        .model-link-btn {
            display: inline-block;
            margin-top: 5px;
            padding: 4px 8px;
            background: rgba(0, 240, 255, 0.2);
            border: 1px solid var(--theme-color);
            color: #fff;
            border-radius: 4px;
            text-decoration: none;
            font-size: 11px;
        }
        .model-link-btn:hover { background: var(--theme-color); color: #000; }

        #core-hud-wrapper {
            position: absolute;
            top: 52%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 620px;
            height: 620px;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        #svg-core-hud {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: center;
            filter: drop-shadow(0 0 25px var(--theme-color)) drop-shadow(0 0 50px var(--theme-glow));
        }

        .audio-wave-ring {
            fill: none;
            stroke: var(--theme-color);
            stroke-width: 3;
            opacity: 0;
            transform-origin: center;
            filter: drop-shadow(0 0 15px var(--theme-color));
        }

        .speaking-active .wave-1 { animation: pulseWave 1.4s infinite ease-out; }
        .speaking-active .wave-2 { animation: pulseWave 1.4s infinite ease-out 0.4s; }
        .speaking-active .wave-3 { animation: pulseWave 1.4s infinite ease-out 0.8s; }

        @keyframes pulseWave {
            0% { transform: scale(0.95); opacity: 0.95; stroke-width: 5; }
            100% { transform: scale(1.5); opacity: 0; stroke-width: 0.5; }
        }

        .rot-clockwise { transform-origin: 310px 310px; animation: spinClockwise 35s linear infinite; }
        .rot-counter { transform-origin: 310px 310px; animation: spinCounter 25s linear infinite; }
        .rot-fast { transform-origin: 310px 310px; animation: spinClockwise 16s linear infinite; }
        .rot-reverse-fast { transform-origin: 310px 310px; animation: spinCounter 12s linear infinite; }
        .rot-extra-ring { transform-origin: 310px 310px; animation: spinClockwise 20s linear infinite; }

        @keyframes spinClockwise { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes spinCounter { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }

        #core-label-fixed {
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 4px;
            fill: var(--theme-color);
            filter: drop-shadow(0 0 6px var(--theme-color)) drop-shadow(0 0 14px var(--theme-glow));
            text-anchor: middle;
            dominant-baseline: central;
        }

        #bottom-watermark {
            position: absolute;
            bottom: 30px;
            left: 68%;
            transform: translateX(-50%);
            font-size: 18px;
            letter-spacing: 4px;
            color: var(--theme-color);
            text-shadow: 0 0 12px var(--theme-glow);
            z-index: 5;
            pointer-events: none;
            font-weight: bold;
        }

        #bottom-bar {
            position: absolute;
            bottom: 25px;
            width: calc(90% - 70px);
            max-width: 620px;
            left: 30px;
            background: var(--theme-bg);
            border: 1px solid var(--theme-glow);
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 8px 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px var(--theme-glow);
            z-index: 9999;
            pointer-events: auto;
        }

        #bottom-bar input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 15px;
            padding: 0 10px;
            pointer-events: auto;
        }

        .hud-btn {
            background: transparent;
            border: 1px solid var(--theme-color);
            color: var(--theme-color);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            margin-left: 8px;
            font-size: 13px;
            transition: 0.2s;
            pointer-events: auto;
        }
        .hud-btn:hover {
            background: var(--theme-color);
            color: #020813;
            box-shadow: 0 0 15px var(--theme-color);
        }

        #mic-btn.listening {
            background: #ff3333;
            border-color: #ff3333;
            color: #fff;
            box-shadow: 0 0 15px #ff3333;
            animation: pulse-mic 1s infinite;
        }

        @keyframes pulse-mic {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    
    <!-- Widget de Clima y Telemetría Superior casi arriba arriba -->
    <div id="top-telemetry-widget" class="interactive">
        <span id="telemetry-time">--:--:--</span>
        <span>|</span>
        <span id="telemetry-weather">CR: 24°C [ESTABLE]</span>
        <span>|</span>
        <span>SYS: 99.8%</span>
    </div>

    <div id="core-hud-wrapper">
        <svg id="svg-core-hud" viewBox="0 0 620 620">
            <g id="voice-waves" class="">
                <circle class="audio-wave-ring wave-1" cx="310" cy="310" r="235"></circle>
                <circle class="audio-wave-ring wave-2" cx="310" cy="310" r="265"></circle>
                <circle class="audio-wave-ring wave-3" cx="310" cy="310" r="295"></circle>
            </g>
            <g class="rot-clockwise">
                <circle cx="310" cy="310" r="285" fill="none" stroke="var(--theme-color)" stroke-width="5" stroke-dasharray="45 20, 15 15, 100 30" opacity="0.95"/>
                <circle cx="310" cy="310" r="268" fill="none" stroke="var(--theme-color)" stroke-width="2" stroke-dasharray="8 8" opacity="0.85"/>
            </g>
            <g class="rot-counter">
                <circle cx="310" cy="310" r="250" fill="none" stroke="var(--theme-color)" stroke-width="3" stroke-dasharray="30 15, 10 10, 60 20" opacity="0.9"/>
                <circle cx="310" cy="310" r="232" fill="none" stroke="var(--theme-color)" stroke-width="1.5" stroke-dasharray="4 12" opacity="0.8"/>
            </g>
            <g class="rot-extra-ring">
                <circle cx="310" cy="310" r="214" fill="none" stroke="var(--theme-color)" stroke-width="4" stroke-dasharray="20 40, 12 8" opacity="0.9"/>
            </g>
            <g class="rot-fast">
                <circle cx="310" cy="310" r="198" fill="none" stroke="var(--theme-color)" stroke-width="12" stroke-dasharray="16 22, 5 7, 40 16" opacity="0.9"/>
                <circle cx="310" cy="310" r="174" fill="none" stroke="var(--theme-color)" stroke-width="3" stroke-dasharray="4 8" opacity="0.98"/>
                <rect x="304" y="68" width="12" height="16" fill="var(--theme-color)" opacity="0.98"/>
                <rect x="304" y="536" width="12" height="16" fill="var(--theme-color)" opacity="0.98"/>
                <rect x="68" y="304" width="16" height="12" fill="var(--theme-color)" opacity="0.98"/>
                <rect x="536" y="304" width="16" height="12" fill="var(--theme-color)" opacity="0.98"/>
            </g>
            <g class="rot-reverse-fast">
                <circle cx="310" cy="310" r="150" fill="none" stroke="var(--theme-color)" stroke-width="18" stroke-dasharray="65 35, 20 20, 40 15" opacity="0.8"/>
                <circle cx="310" cy="310" r="126" fill="none" stroke="var(--theme-color)" stroke-width="2.5" opacity="0.95"/>
            </g>
            <circle cx="310" cy="310" r="104" fill="var(--theme-bg)" stroke="var(--theme-color)" stroke-width="4" opacity="0.99"/>
            <circle cx="310" cy="310" r="92" fill="none" stroke="var(--theme-color)" stroke-width="1.5" stroke-dasharray="5 6" opacity="0.8"/>
            <text x="310" y="312" id="core-label-fixed" text-anchor="middle" dominant-baseline="central">JARVIS</text>
        </svg>
    </div>

    <div id="hud-container">
        
        <div id="api-config-panel" class="interactive">
            <div class="api-row">
                <span style="width: 75px;">Groq:</span>
                <input type="password" id="groq-key-input" placeholder="gsk_..." onchange="saveKeys()">
            </div>
            <div class="api-row">
                <span style="width: 75px;">Tavily:</span>
                <input type="password" id="tavily-key-input" placeholder="tvly-..." onchange="saveKeys()">
            </div>
            <div class="api-row">
                <span style="width: 75px;">ElevenLabs:</span>
                <input type="password" id="eleven-key-input" placeholder="xi-..." onchange="saveKeys()">
            </div>
            <button class="hud-btn" style="padding: 3px 8px; font-size: 10px; margin-left: 0;" onclick="saveKeys()">Guardar Credencial</button>
        </div>

        <button id="settings-toggle-btn" class="hud-btn interactive" style="padding: 8px 12px; font-size: 13px;" onclick="toggleSettingsMenu()">⚙️ Config</button>

        <div id="settings-modal" class="interactive">
            <h3>PANEL DE CONFIGURACIÓN J.A.R.V.I.S.</h3>
            
            <div class="setting-group">
                <label>Motor de Voz (ElevenLabs / Edge):</label>
                <select id="tts-engine-select">
                    <option value="elevenlabs">ElevenLabs (Neural Avanzado)</option>
                    <option value="edgetts">Edge TTS (Respaldo Gratuito)</option>
                </select>
            </div>

            <div class="setting-group">
                <label>Voz 유사 a JARVIS (ElevenLabs Free):</label>
                <select id="eleven-voice-select">
                    <option value="GBv7sJhOatEwLGWKpayI">George (Profunda / Clásica Jarvis)</option>
                    <option value="EXAVITQu4vr4xnSDxMaL">Adam (Clara y Formal)</option>
                    <option value="ErXwobaYiN019PkySvjV">Antoni (Sutil y Elegante)</option>
                    <option value="VR6AewLTigWG4xSOukaG">Arnold (Firme / Masculina)</option>
                    <option value="21m00Tcm4TlvDq8ikWAM">Rachel (Clásica Femenina)</option>
                </select>
            </div>

            <div class="setting-group">
                <label>Respaldo Edge TTS (Masculino):</label>
                <select id="edge-voice-select">
                    <option value="es-ES-AlvaroNeural">Álvaro Neural (Masculino Cine)</option>
                    <option value="es-MX-DarioNeural">Darío Neural (Masculino Neutro)</option>
                    <option value="es-AR-TomasNeural">Tomás Neural (Masculino Maduro)</option>
                </select>
            </div>

            <div style="display: flex; gap: 6px; margin-top: 5px;">
                <button class="hud-btn" style="flex: 1; margin: 0; font-size: 10px; padding: 5px;" onclick="clearChatHistory()">Limpiar Chat</button>
                <button class="hud-btn" style="flex: 1; margin: 0; font-size: 10px; padding: 5px; border-color: #00ff88; color: #00ff88;" onclick="restartSystem()">🔄 Reiniciar</button>
            </div>

            <button class="hud-btn" style="margin-left: 0; margin-top: 2px; text-align: center; font-size: 11px;" onclick="toggleSettingsMenu()">Cerrar Panel</button>
        </div>

        <div id="jarvis-chat" class="interactive">
            <div class="msg jarvis" id="welcome-msg">JARVIS: Núcleo GPT-OSS conectado, señor. A su orden.</div>
        </div>

        <div id="top-right-slot" class="interactive">
            <div class="slot-title">SLOT 3D & COMPILADOR CAD</div>
            <div id="viewer-3d"></div>
            <div id="cad-code-display">// Sistema de Red Listos...\n> Indique modelo o estructura para compilar en 3D, bro.</div>
        </div>

        <div id="bottom-watermark">J.A.R.V.I.S.</div>

        <div id="bottom-bar">
            <input type="text" id="user-input" placeholder="Indique su orden a JARVIS, bro..." onkeypress="checkEnter(event)">
            <button id="mic-btn" class="hud-btn" onclick="toggleSpeechRecognition()" title="Activar escucha de voz">🎙️</button>
            <button class="hud-btn" onclick="sendPrompt()">Enviar</button>
        </div>

    </div>

    <script>
        // Reloj y Telemetría en tiempo real
        setInterval(() => {
            const now = new Date();
            document.getElementById('telemetry-time').innerText = now.toLocaleTimeString();
        }, 1000);

        const canvas = document.getElementById('bg-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        camera.position.z = 6;

        const particlesCount = 300;
        const particlesGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particlesCount * 3);
        for(let i=0; i<particlesCount*3; i+=3) {
            positions[i] = (Math.random() - 0.5) * 20;
            positions[i+1] = (Math.random() - 0.5) * 20;
            positions[i+2] = (Math.random() - 0.5) * 20;
        }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particlesMat = new THREE.PointsMaterial({ size: 0.03, color: 0x00f0ff, transparent: true, opacity: 0.3 });
        const particleSystem = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particleSystem);

        function animateBg() {
            requestAnimationFrame(animateBg);
            particleSystem.rotation.y += 0.0005;
            renderer.render(scene, camera);
        }
        animateBg();

        const viewerContainer = document.getElementById('viewer-3d');
        const scene3D = new THREE.Scene();
        const camera3D = new THREE.PerspectiveCamera(60, viewerContainer.clientWidth / viewerContainer.clientHeight, 0.1, 1000);
        const renderer3D = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer3D.setSize(viewerContainer.clientWidth, viewerContainer.clientHeight);
        viewerContainer.appendChild(renderer3D.domElement);

        let activeMeshGroup = new THREE.Group();
        scene3D.add(activeMeshGroup);
        camera3D.position.z = 3.2;

        let isStarkMode = false;

        function setStarkTheme(active) {
            isStarkMode = active;
            const root = document.documentElement;
            const svgCore = document.getElementById('svg-core-hud');
            if (active) {
                root.style.setProperty('--theme-color', '#ff3333');
                root.style.setProperty('--theme-glow', 'rgba(255, 50, 50, 0.6)');
                root.style.setProperty('--theme-bg', 'rgba(20, 2, 2, 0.95)');
                particlesMat.color.setHex(0xff3333);
                if(svgCore) svgCore.style.filter = "drop-shadow(0 0 25px #ff3333) drop-shadow(0 0 50px rgba(255, 50, 50, 0.6))";
            } else {
                root.style.setProperty('--theme-color', '#00f0ff');
                root.style.setProperty('--theme-glow', 'rgba(0, 240, 255, 0.6)');
                root.style.setProperty('--theme-bg', 'rgba(2, 8, 19, 0.95)');
                particlesMat.color.setHex(0x00f0ff);
                if(svgCore) svgCore.style.filter = "drop-shadow(0 0 25px #00f0ff) drop-shadow(0 0 50px rgba(0, 240, 255, 0.6))";
            }
        }

        function updateVisorModel(type) {
            while(activeMeshGroup.children.length > 0){ 
                const obj = activeMeshGroup.children[0];
                activeMeshGroup.remove(obj);
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) obj.material.dispose();
            }

            if (type === 'armor') {
                setStarkTheme(true);
                const matGold = new THREE.MeshBasicMaterial({ color: 0xffaa00, wireframe: true });
                const matRed = new THREE.MeshBasicMaterial({ color: 0xff0033, wireframe: true });
                const chestBox = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.1, 0.5), matRed);
                const helmetBox = new THREE.Mesh(new THREE.DodecahedronGeometry(0.4), matGold);
                helmetBox.position.set(0, 0.85, 0);
                activeMeshGroup.add(chestBox);
                activeMeshGroup.add(helmetBox);
            } else if (type === 'robot_arm' || type === 'search_mesh') {
                setStarkTheme(false);
                const matCyan = new THREE.MeshBasicMaterial({ color: 0x00ffaa, wireframe: true });
                const baseCyl = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.8, 0.3, 16), matCyan);
                baseCyl.position.set(0, -0.8, 0);
                const armJoint = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.2, 0.3), matCyan);
                const armClaw = new THREE.Mesh(new THREE.ConeGeometry(0.4, 0.6, 8), matCyan);
                armClaw.position.set(0, 0.8, 0);
                activeMeshGroup.add(baseCyl);
                activeMeshGroup.add(armJoint);
                activeMeshGroup.add(armClaw);
            } else {
                setStarkTheme(false);
                let geom = (type === 'sphere') ? new THREE.SphereGeometry(0.9, 16, 16) : new THREE.BoxGeometry(1.0, 1.0, 1.0);
                let mat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true });
                activeMeshGroup.add(new THREE.Mesh(geom, mat));
            }
        }

        updateVisorModel('box');

        function animateSlot3D() {
            requestAnimationFrame(animateSlot3D);
            if (activeMeshGroup) {
                activeMeshGroup.rotation.x += 0.01;
                activeMeshGroup.rotation.y += 0.015;
            }
            renderer3D.render(scene3D, camera3D);
        }
        animateSlot3D();

        function getSystemPrompt() {
            return "Eres J.A.R.V.I.S., el mayordomo virtual y asistente de inteligencia artificial de Tony Stark. Eres educado, sumamente inteligente, leal, sofisticado y formal. Conversas con el usuario de manera fluida y amigable.";
        }

        let chatHistory = [
            { role: "system", content: getSystemPrompt() }
        ];

        function toggleSettingsMenu() {
            const modal = document.getElementById('settings-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function clearChatHistory() {
            const chat = document.getElementById('jarvis-chat');
            chat.innerHTML = `<div class="msg jarvis" id="welcome-msg">JARVIS: Memoria de chat depurada, bro. A su orden.</div>`;
            chatHistory = [{ role: "system", content: getSystemPrompt() }];
        }

        function restartSystem() { location.reload(); }

        function saveKeys() {
            const groqKey = document.getElementById('groq-key-input').value.trim();
            const tavilyKey = document.getElementById('tavily-key-input').value.trim();
            const elevenKey = document.getElementById('eleven-key-input').value.trim();
            if (groqKey) localStorage.setItem('groq_api_key', groqKey);
            if (tavilyKey) localStorage.setItem('tavily_api_key', tavilyKey);
            if (elevenKey) localStorage.setItem('eleven_api_key', elevenKey);
            
            chatHistory = [{ role: "system", content: getSystemPrompt() }];
            addChatMessage("JARVIS: Credenciales actualizadas y memoria depurada, bro. A su orden.", "jarvis");
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedGroq = localStorage.getItem('groq_api_key');
            const savedTavily = localStorage.getItem('tavily_api_key');
            const savedEleven = localStorage.getItem('eleven_api_key');
            if (savedGroq) document.getElementById('groq-key-input').value = savedGroq;
            if (savedTavily) document.getElementById('tavily-key-input').value = savedTavily;
            if (savedEleven) document.getElementById('eleven-key-input').value = savedEleven;
        });

        let recognition = null;
        let isListening = false;
        let shouldKeepListening = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                const micBtn = document.getElementById('mic-btn');
                if (micBtn) micBtn.classList.add('listening');
                const input = document.getElementById('user-input');
                if (input) input.placeholder = "Escuchando... diga 'Jarvis' + orden, bro.";
            };

            recognition.onresult = (event) => {
                let speechToText = event.results[event.results.length - 1][0].transcript.trim();
                const lowerText = speechToText.toLowerCase();
                
                if (lowerText.includes("jarvis")) {
                    let cleanOrder = speechToText.replace(/jarvis/gi, "").trim();
                    if (cleanOrder.length > 0) {
                        document.getElementById('user-input').value = cleanOrder;
                        sendPrompt();
                    } else {
                        speakJarvis("A su orden, bro.");
                    }
                }
            };

            recognition.onend = () => {
                if (shouldKeepListening) {
                    try { recognition.start(); } catch(e) {}
                } else {
                    stopListeningState();
                }
            };
        }

        function stopListeningState() {
            shouldKeepListening = false;
            isListening = false;
            const micBtn = document.getElementById('mic-btn');
            if (micBtn) micBtn.classList.remove('listening');
            const input = document.getElementById('user-input');
            if (input) input.placeholder = "Indique su orden a JARVIS, bro...";
        }

        function toggleSpeechRecognition() {
            if (!recognition) {
                alert("Su navegador no soporta reconocimiento de voz nativo, bro.");
                return;
            }
            if (isListening) {
                shouldKeepListening = false;
                recognition.stop();
                stopListeningState();
            } else {
                shouldKeepListening = true;
                try { recognition.start(); } catch(e) { recognition.stop(); }
            }
        }

        let lastQueryTimestamp = 0;
        const QUERY_COOLDOWN_MS = 2500;

        async function buscarEnInternet(query) {
            const tavilyKey = localStorage.getItem('tavily_api_key') || document.getElementById('tavily-key-input').value.trim();
            if (!tavilyKey) return null;

            try {
                const response = await fetch("https://api.tavily.com/search", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        api_key: tavilyKey,
                        query: query,
                        max_results: 3,
                        search_depth: "basic"
                    })
                });
                const data = await response.json();
                if (data && data.results) {
                    return data.results.map(r => r.content).join("\n\n");
                }
            } catch (error) {
                console.error("Error en búsqueda web:", error);
            }
            return null;
        }

        async function queryAI(userText) {
            const now = Date.now();
            if (now - lastQueryTimestamp < QUERY_COOLDOWN_MS) {
                return "A su orden, bro, procesando con demasiada rapidez. Aguarde un momento para liberar el canal de voz.";
            }
            lastQueryTimestamp = now;

            const groqKey = localStorage.getItem('groq_api_key') || document.getElementById('groq-key-input').value.trim();
            if (!groqKey) return "Por favor, configure su llave de API de Groq en el panel superior izquierdo, bro.";
            
            const lowerText = userText.toLowerCase();
            const triggerBusqueda = "busca en internet";

            if (lowerText.includes(triggerBusqueda)) {
                let terminoBusqueda = userText.toLowerCase().replace(triggerBusqueda, "").trim();
                terminoBusqueda = terminoBusqueda.replace(/^[:,\s-]+/, "");
                if (!terminoBusqueda) {
                    terminoBusqueda = userText;
                }

                addChatMessage("JARVIS: Accediendo a los nodos de red globales para buscar: " + terminoBusqueda, "jarvis");
                let contextoWeb = await buscarEnInternet(terminoBusqueda);
                
                if (contextoWeb) {
                    userText = `${userText}\n\n[Información en tiempo real de internet:\n${contextoWeb}]`;
                }
            }

            chatHistory.push({ role: "user", content: userText });
            return await callGroqAPI(groqKey);
        }

        async function callGroqAPI(key) {
            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${key}`
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b",
                        messages: chatHistory,
                        max_tokens: 2048
                    })
                });
                const data = await response.json();
                if (data.choices && data.choices[0] && data.choices[0].message) {
                    const reply = data.choices[0].message.content;
                    chatHistory.push({ role: "assistant", content: reply });
                    return reply;
                } else if (data.error) {
                    return `A su orden, bro, error de Groq: ${data.error.message || 'Desconocido'}`;
                }
                return "Disculpe, bro, respuesta vacía de Groq.";
            } catch (err) {
                return "Disculpe, bro, falló la conexión con la API de Groq.";
            }
        }

        async function sendPrompt() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            addChatMessage(text, "user");
            input.value = "";

            const lower = text.toLowerCase();
            let codeSnippet = '';

            if (lower.includes("protocolo stark") && !lower.includes("apagar") && !lower.includes("desactivar")) {
                setStarkTheme(true);
            } else if (lower.includes("apagar protocolo stark") || lower.includes("desactivar protocolo stark") || lower.includes("apagar stark") || lower.includes("desactivar stark")) {
                setStarkTheme(false);
            } else if (lower.includes("código") || lower.includes("code") || lower.includes("function") || lower.includes("class")) {
                setStarkTheme(true);
            }

            if (lower.includes("busca modelo") || lower.includes("modelo 3d") || lower.includes("stl") || lower.includes("imprimir") || lower.includes("brazo")) {
                let cleanQuery = text.replace(/jarvis|busca|el modelo|un modelo|stl|de|para|imprimir|en|printables|thingiverse/gi, "").trim();
                if (!cleanQuery) cleanQuery = "modelo 3d";
                let encodedSearch = encodeURIComponent(cleanQuery);

                updateVisorModel('search_mesh');
                codeSnippet = `// COMPILADOR CAD - MODELO RESUMIDO\nQuery: "${cleanQuery}"\nEstado: Malla 3D Generada\nStatus: [OK]`;
                
                let searchHtml = `JARVIS: Búsqueda de "${cleanQuery}" procesada y enlaces generados, bro. A su orden.<br>
                <a class="model-link-btn" href="https://www.printables.com/search/models?q=${encodedSearch}" target="_blank">🔍 Buscar en Printables (${cleanQuery})</a>
                <a class="model-link-btn" href="https://www.thingiverse.com/search?q=${encodedSearch}" target="_blank">🔍 Buscar en Thingiverse (${cleanQuery})</a>`;
                
                document.getElementById('cad-code-display').innerText = codeSnippet;
                addChatMessage(searchHtml, "jarvis", true);
                speakJarvis(`He procesado el modelo ${cleanQuery} en el compilador CAD y localizado los enlaces, bro.`);
                return;
            }

            if (lower.includes("armadura") || lower.includes("traje") || lower.includes("mark")) {
                updateVisorModel('armor');
                codeSnippet = '// PROTOCOLO STARK\nAssembly.loadArmorMatrix();\nDimensiones: Escala Humana\nStatus: [OK]';
            } else if (lower.includes("esfera")) {
                updateVisorModel('sphere');
                codeSnippet = '// Geometría Esférica\nGeometry.createSphere();\nRadio: 0.9m\nStatus: [OK]';
            } else if (codeSnippet === '') {
                codeSnippet = `// ORDEN RECIBIDA: "${text}"\nEjecutando procesamiento neural...\nStatus: [OK]`;
            }

            document.getElementById('cad-code-display').innerText = codeSnippet;

            const aiResponse = await queryAI(text);
            addChatMessage("JARVIS: " + aiResponse, "jarvis");
            speakJarvis(aiResponse);
        }

        function checkEnter(e) {
            if (e.key === 'Enter') sendPrompt();
        }

        function addChatMessage(text, sender, isHtml = false) {
            const chat = document.getElementById('jarvis-chat');
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            if (isHtml) { div.innerHTML = text; } else { div.innerText = text; }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function speakJarvis(text) {
            const waveGroup = document.getElementById('voice-waves');
            if (waveGroup) waveGroup.classList.add('speaking-active');

            const cleanText = text.replace(/<[^>]*>?/gm, '').replace(/["'«»\[\]]/g, '');
            const ttsEngine = document.getElementById('tts-engine-select').value;
            const elevenKey = localStorage.getItem('eleven_api_key') || document.getElementById('eleven-key-input').value.trim();
            const selectedVoiceId = document.getElementById('eleven-voice-select').value;

            if (ttsEngine === 'elevenlabs' && elevenKey) {
                try {
                    const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${selectedVoiceId}`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "xi-api-key": elevenKey
                        },
                        body: JSON.stringify({
                            text: cleanText,
                            model_id: "eleven_multilingual_v2",
                            voice_settings: { stability: 0.5, similarity_boost: 0.75 }
                        })
                    });

                    if (response.ok) {
                        const audioBlob = await response.blob();
                        const audioUrl = URL.createObjectURL(audioBlob);
                        const audio = new Audio(audioUrl);
                        audio.onended = () => { if (waveGroup) waveGroup.classList.remove('speaking-active'); };
                        audio.play();
                        return;
                    }
                } catch (e) {
                    console.error("Error ElevenLabs, usando respaldo:", e);
                }
            }

            // Respaldo Edge TTS
            const selectedVoice = document.getElementById('edge-voice-select').value || "es-ES-AlvaroNeural";
            try {
                const response = await fetch("https://tts.travisvn.com/v1/audio/speech", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer free-edge-tts"
                    },
                    body: JSON.stringify({
                        model: "tts-1",
                        input: cleanText,
                        voice: selectedVoice,
                        response_format: "mp3"
                    })
                });

                if (response.ok) {
                    const audioBlob = await response.blob();
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const audio = new Audio(audioUrl);
                    audio.onended = () => { if (waveGroup) waveGroup.classList.remove('speaking-active'); };
                    audio.play();
                } else {
                    fallbackBrowserSpeech(cleanText, waveGroup);
                }
            } catch (err) {
                fallbackBrowserSpeech(cleanText, waveGroup);
            }
        }

        function fallbackBrowserSpeech(text, waveGroup) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const speech = new SpeechSynthesisUtterance(text);
                speech.lang = 'es-ES';
                speech.rate = 0.9;
                speech.pitch = 0.3;
                speech.onend = () => { if (waveGroup) waveGroup.classList.remove('speaking-active'); };
                window.speechSynthesis.speak(speech);
            } else {
                if (waveGroup) waveGroup.classList.remove('speaking-active');
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
